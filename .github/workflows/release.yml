name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ''
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Download sidecar binaries
        shell: bash
        run: bash .github/scripts/download-sidecars.sh "${{ matrix.rust_target }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Yank Trove v__VERSION__'
          generateReleaseNotes: true
          releaseBody: |
            Windows / macOS 向けインストーラーです。yt-dlp と Deno を同梱しています。

            ## インストール
            - **Windows（一般向け）**: `Yank Trove_*_x64-setup.exe`（NSIS）
            - **Windows（組織向け）**: `Yank Trove_*_x64_*.msi`
            - **macOS（Apple Silicon）**: `*.dmg`（aarch64）
            - **macOS（Intel）**: `*.dmg`（x64）

            macOS は開発環境での動作確認ができていません。問題があれば Issue で報告してください。

            FFmpeg が必要な場合は README の手順を参照してください。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
