name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release with generated notes
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^v ]]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi

          INSTALL="$(cat <<'EOF'
          Windows / macOS / Linux 向けの配布物です。yt-dlp と Deno を同梱しています。

          ## インストール
          - **Windows（一般向け）**: `Yank Trove_*_x64-setup.exe`（NSIS）
          - **Windows（組織向け）**: `Yank Trove_*_x64_*.msi`
          - **macOS（Apple Silicon）**: `*.dmg`（aarch64）
          - **macOS（Intel）**: `*.dmg`（x64）
          - **Linux（x86_64）**: `*.deb`（Ubuntu 22.04 / Debian 12 相当を想定）

          macOS は開発環境での動作確認ができていません。Linux も実機での継続確認は限定的です。問題があれば Issue で報告してください。

          FFmpeg が必要な場合は README の手順を参照してください（.deb の Depends には含めません）。
          EOF
          )"

          GENERATED="$(git log --pretty=format:'- %s' "$(git describe --tags --abbrev=0 "${TAG}^")..${TAG}" \
            | grep -v '^- release:' || true)"
          if [[ -z "${GENERATED}" ]]; then
            GENERATED="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" --jq .body)"
          fi
          NOTES="${INSTALL}"$'\n\n'"## 変更"$'\n\n'"${GENERATED}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "Yank Trove ${TAG}" --notes "${NOTES}"
          else
            gh release create "${TAG}" --title "Yank Trove ${TAG}" --notes "${NOTES}" --target "${GITHUB_SHA}"
          fi

          ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)"
          echo "release_id=${ID}" >> "${GITHUB_OUTPUT}"

  publish:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ''
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          # Ubuntu 22.04 keeps WebKitGTK 4.1 + older glibc for broader .deb compatibility.
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: '--bundles deb'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Download sidecar binaries
        shell: bash
        run: bash .github/scripts/download-sidecars.sh "${{ matrix.rust_target }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
