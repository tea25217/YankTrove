[package]
name = "yank-trove"
version = "0.12.2"
description = "Yank Trove  Ea desktop app for YouTube channel and playlist archives"
authors = ["berrytea (2026)"]
edition = "2024"

[lib]
name = "yank_trove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0.18"
regex = "1.13.0"
encoding_rs = "0.8"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
