title = "Yank Trove"

[extend]
useDefault = true

[allowlist]
description = "Generated lockfiles and known project addresses"
paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)Cargo\.lock$''',
  '''(^|/)src-tauri/Cargo\.lock$''',
  '''(^|/)scripts/scan-secrets\.sh$''',
]
regexes = [
  '''tea25217@users\.noreply\.github\.com''',
]

[[rules]]
id = "dotenv-file"
description = "Committed .env file"
path = '''(^|/)\.env($|\.(?!example$))'''
regex = '''.'''
tags = ["secret", "dotenv"]

[[rules]]
id = "credential-filename"
description = "Credential or key file"
path = '''(?i)(^|/)(credentials\.json|secrets\.json|id_rsa|id_ed25519|.*\.(pem|p12|pfx))$'''
regex = '''.'''
tags = ["secret", "keyfile"]

[[rules]]
id = "jp-phone-number"
description = "Japanese phone number next to a personal-data label"
regex = '''(?i)(?:電話|携帯|スマホ|mobile|tel|phone)[^\n]{0,24}(0[789]0-?\d{4}-?\d{4}|0\d{1,4}-?\d{1,4}-\d{4})'''
tags = ["pii", "phone"]

[[rules]]
id = "email-assignment"
description = "Email assigned in config or environment-like text"
regex = '''(?i)(?:email|e-mail|mail_address|メール)['"\s:=]+[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}'''
tags = ["pii", "email"]
